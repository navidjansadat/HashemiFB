<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"><title>خانه | HASHEMI FB</title>
</head><body>
<header class="topbar glass"><div class="brand"><span class="brand-mini">H</span><b>HASHEMI FB</b></div>
<div class="top-actions"><button id="searchBtn" class="icon-btn">🔍</button><button id="notifBtn" class="icon-btn">🔔<span id="notifDot"></span></button><button id="profileBtn" class="avatar-btn">👤</button></div></header>
<div id="searchBox" class="search-panel hidden"><input id="searchInput" placeholder="جستجوی اعضا یا پست‌ها..."><button id="closeSearch">✕</button></div>
<main class="container">
<section id="pendingBox" class="notice hidden"></section>
<section class="composer card">
<div class="row"><div id="meAvatar" class="avatar">👤</div><textarea id="postText" maxlength="2000" placeholder="چه خبر؟ با خانواده به اشتراک بگذارید..."></textarea></div>
<div class="composer-actions"><label class="btn ghost">🖼️ عکس<input id="postImage" type="file" accept="image/*" hidden></label><span id="imageName" class="muted small"></span><button id="publish" class="btn primary">انتشار</button></div>
</section>
<section id="feed" class="feed"></section>
<div id="empty" class="empty hidden">هنوز پستی وجود ندارد. اولین پست را شما بسازید ❤️</div>
</main>
